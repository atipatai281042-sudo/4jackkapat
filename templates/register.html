{% extends "base.html" %}
{% block title %}สมัครสมาชิก — Yonko Rewards{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <header class="auth-head">
      <h1 class="auth-title">สมัครสมาชิก</h1>
    </header>

    <form method="post" class="auth-form" autocomplete="off">
      <div class="form-group">
        <label for="username" class="form-label">ชื่อผู้ใช้ <span class="form-required">*</span></label>
        <input type="text" id="username" name="username" class="form-input" required minlength="4" autocomplete="off" pattern="[A-Za-z0-9!@#$%^&amp;*._+-]+" title="ใช้ภาษาอังกฤษ ตัวเลข หรืออักขระพิเศษเท่านั้น" />
        <small class="form-hint">อย่างน้อย 4 ตัว ใช้ภาษาอังกฤษ ตัวเลข หรืออักขระพิเศษ</small>
      </div>

      <div class="form-group">
        <label for="phone" class="form-label">เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" name="phone" class="form-input" />
      </div>

      <div class="form-group">
        <label for="invite_code" class="form-label">รหัสแนะนำจาก Agent</label>
        <input type="text" id="invite_code" name="invite_code" class="form-input" value="{{ request.args.get('invite', '') }}" placeholder="ถ้ามีรหัสแนะนำ" />
        <small class="form-hint">เว้นว่างได้ หากไม่มีรหัสแนะนำ</small>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password" class="form-label">รหัสผ่าน <span class="form-required">*</span></label>
          <div class="password-input-wrap">
            <input type="password" id="password" name="password" class="form-input password-input" required minlength="6" autocomplete="new-password" pattern="[A-Za-z0-9!@#$%^&amp;*._+-]+" title="ใช้ภาษาอังกฤษ ตัวเลข หรืออักขระพิเศษเท่านั้น" />
            <button type="button" class="password-toggle" aria-label="แสดงรหัสผ่าน">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="confirm_password" class="form-label">ยืนยันรหัสผ่าน <span class="form-required">*</span></label>
          <div class="password-input-wrap">
            <input type="password" id="confirm_password" name="confirm_password" class="form-input password-input" required autocomplete="new-password" pattern="[A-Za-z0-9!@#$%^&amp;*._+-]+" title="ใช้ภาษาอังกฤษ ตัวเลข หรืออักขระพิเศษเท่านั้น" />
            <button type="button" class="password-toggle" aria-label="แสดงรหัสผ่าน">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <small id="password-match-hint" class="form-hint" aria-live="polite"></small>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">สมัครสมาชิก</button>
    </form>

    <footer class="auth-foot">
      <p class="auth-foot-text">มีบัญชีอยู่แล้ว? <a href="{{ url_for('login') }}" class="auth-link">เข้าสู่ระบบ</a></p>
    </footer>
  </div>
</section>
<script>
  const registerForm = document.querySelector('.auth-form');
  const passwordInput = document.querySelector('#password');
  const confirmPasswordInput = document.querySelector('#confirm_password');
  const passwordMatchHint = document.querySelector('#password-match-hint');
  function validatePasswordMatch() {
    const mismatch = confirmPasswordInput.value && passwordInput.value !== confirmPasswordInput.value;
    confirmPasswordInput.setCustomValidity(mismatch ? 'รหัสผ่านไม่ตรงกัน' : '');
    passwordMatchHint.textContent = mismatch ? 'รหัสผ่านไม่ตรงกัน' : '';
    passwordMatchHint.style.color = mismatch ? '#fca5a5' : '';
  }
  passwordInput.addEventListener('input', validatePasswordMatch);
  confirmPasswordInput.addEventListener('input', validatePasswordMatch);
  registerForm.addEventListener('submit', validatePasswordMatch);
</script>
{% endblock %}
