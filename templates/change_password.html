{% extends "base.html" %}
{% block title %}เปลี่ยนรหัสผ่าน — mklotto{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card password-change-card">
    <header class="auth-head">
      <span class="eyebrow">ACCOUNT SECURITY</span>
      <h1 class="auth-title"><i class="fas fa-key"></i> เปลี่ยนรหัสผ่าน</h1>
      <p class="auth-subtitle">อัปเดตรหัสผ่านบัญชี {{ current_user.username }}</p>
    </header>
    <form method="post" class="auth-form">
      <div class="form-group">
        <label for="current-password" class="form-label">รหัสผ่านเดิม</label>
        <div class="password-input-wrap"><input id="current-password" class="form-input password-input" type="password" name="current_password" required><button type="button" class="password-toggle" aria-label="แสดงรหัสผ่าน"><i class="fa-regular fa-eye"></i></button></div>
      </div>
      <div class="form-group">
        <label for="new-password" class="form-label">รหัสผ่านใหม่</label>
        <div class="password-input-wrap"><input id="new-password" class="form-input password-input" type="password" name="new_password" minlength="6" pattern="[A-Za-z0-9!@#$%^&amp;*._+-]+" required><button type="button" class="password-toggle" aria-label="แสดงรหัสผ่าน"><i class="fa-regular fa-eye"></i></button></div>
        <small class="form-hint">อย่างน้อย 6 ตัว ใช้ภาษาอังกฤษ ตัวเลข หรืออักขระพิเศษ</small>
      </div>
      <div class="form-group">
        <label for="confirm-password" class="form-label">ยืนยันรหัสผ่านใหม่</label>
        <div class="password-input-wrap"><input id="confirm-password" class="form-input password-input" type="password" name="confirm_password" minlength="6" pattern="[A-Za-z0-9!@#$%^&amp;*._+-]+" required><button type="button" class="password-toggle" aria-label="แสดงรหัสผ่าน"><i class="fa-regular fa-eye"></i></button></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> บันทึกรหัสผ่านใหม่</button>
      <a href="{{ url_for('index') }}" class="btn btn-ghost btn-block">ยกเลิก</a>
    </form>
  </div>
</section>
{% endblock %}
