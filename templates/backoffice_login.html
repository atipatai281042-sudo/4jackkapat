<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Backoffice Login — mklotto</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d14;color:#eef3fa;font-family:Kanit,sans-serif}.login{width:min(420px,calc(100% - 32px));padding:32px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:#121a25;box-shadow:0 22px 60px #0008}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;color:#e7bf67}.brand img{width:52px;height:52px;object-fit:contain}.brand strong{display:block;font-size:22px}.brand small{color:#8492a5;letter-spacing:.14em;font-size:10px}.kicker{color:#d9b35c;letter-spacing:.14em;font-size:11px}h1{margin:5px 0 20px;font-size:25px}label{display:block;margin:13px 0 5px;color:#9eabbd;font-size:13px}input{width:100%;padding:12px 13px;border:1px solid #2a3849;border-radius:7px;background:#0c131d;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:7px;background:linear-gradient(135deg,#ead39d,#a98236);color:#17130c;font:600 15px Kanit;cursor:pointer}.flash{padding:9px 10px;border-radius:6px;background:#4a2225;color:#ffb6b6;font-size:13px}</style></head><body><main class="login"><div class="brand"><img src="{{ url_for('static', filename='brand-logo.png') }}" alt="mklotto"><div><strong>mklotto</strong><small>BACKOFFICE</small></div></div><span class="kicker">ADMIN CONTROL CENTER</span><h1>เข้าสู่ระบบหลังบ้าน</h1>{% with messages=get_flashed_messages() %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label for="username">ชื่อผู้ใช้</label><input id="username" name="username" autocomplete="username" required><label for="password">รหัสผ่าน</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">เข้าสู่ Backoffice</button></form></main></body></html>
